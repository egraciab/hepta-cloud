# /etc/hepta-backup.conf de la VM hepta-drive (HEPTA Drive: un Nextcloud por cliente). Permisos 600, dueño root.
#
# Esto cubre lo chico: la configuración de la VM y un volcado de la base de cada cliente cada 6 horas, que el
# servidor de respaldos retira al NAS como en las demás VM. Los ARCHIVOS de los clientes (cientos de GB) no van por
# acá: los manda hepta-drive-respaldo.sh con restic a su propio repositorio (infra/hepta-drive/respaldo/).
NOMBRE=hepta-drive

# Cada cliente tiene su Postgres en un contenedor propio (<cliente>-db-1, usuario y base: nextcloud).
PG_MODO=ninguno

# Dos líneas por cliente (la base y sus roles: Nextcloud crea su propio usuario oc_...). El alta de un cliente agrega la suya.
VOLCADOS_EXTRA=(
  "hepta-nextcloud.dump|docker exec hepta-db-1 pg_dump -U nextcloud -Fc nextcloud"
  "hepta-globales.sql|docker exec hepta-db-1 pg_dumpall -U nextcloud --globals-only"
)

DIRECTORIOS=()

# compose.yaml y .env de la parte compartida y de cada cliente, la red de la VM y el acceso al servidor de
# respaldos (sin las contraseñas de los repositorios: esas viven en KeePass y en /etc/hepta-drive-respaldo/*.env).
CONFIGS=(
  /opt/hepta-drive
  /etc/netplan/01-hepta.yaml
  ?/etc/hepta-drive-respaldo/servidor.conf
  ?/etc/hepta-drive-respaldo/servidor.pem
  ?/etc/cron.d/hepta-drive-respaldo
)

RETENER=8
