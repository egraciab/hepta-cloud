# /etc/hepta-backup.conf de la VM retopa-core (RetoPA producción). Permisos 600, dueño root.
NOMBRE=retopa-core

# Postgres corre en el contenedor retopa-db (usuario y base: retopa)
PG_MODO=docker
PG_CONTENEDOR=retopa-db
PG_USUARIO=retopa
PG_BASES=auto
PG_EXCLUIR=""

# Imágenes subidas por los negocios (volumen de Docker retopa_uploads)
DIRECTORIOS=(
  /var/lib/docker/volumes/retopa_retopa_uploads/_data
)

CONFIGS=(
  /opt/retopa/.env
  /opt/retopa/docker-compose.yml
  /opt/retopa/nginx/default.conf
)

RETENER=8
