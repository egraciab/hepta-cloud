# /etc/hepta-backup.conf de la VM HGSVRLNX111 (ERP del grupo, Odoo Enterprise 19 en Docker). Permisos 600, dueño root.
NOMBRE=HGSVRLNX111

# Postgres corre en el contenedor odoo19-proyecto-db-1 (imagen con pgvector), usuario odoo
PG_MODO=docker
PG_CONTENEDOR=odoo19-proyecto-db-1
PG_USUARIO=odoo
PG_BASES=auto                # heptagroup y heptagroup_test
PG_EXCLUIR=""

DIRECTORIOS=(
  /root/odoo19-proyecto/odoo-data/filestore        # adjuntos de producción
  "?/root/odoo19-proyecto/odoo-data-test/filestore"  # adjuntos de la base de prueba ("?" = opcional)
  /root/odoo19-proyecto/addons                     # módulos propios en uso
)

CONFIGS=(
  /root/odoo19-proyecto/docker-compose.yml
  /root/odoo19-proyecto/config
  "?/root/odoo19-proyecto/config-test"
  "?/root/odoo19-proyecto/docker"
  "?/root/odoo19-proyecto/.env"
)

RETENER=8
