# /etc/hepta-backup.conf de la VM HGSVRLNX111 (ERP del grupo, Odoo Enterprise 19 en Docker). Permisos 600, dueño root.
NOMBRE=HGSVRLNX111

# Postgres corre en el contenedor odoo19-proyecto-db-1 (imagen con pgvector), usuario odoo
PG_MODO=docker
PG_CONTENEDOR=odoo19-proyecto-db-1
PG_USUARIO=odoo
PG_BASES=auto                # heptagroup y heptagroup_test
PG_EXCLUIR=""

# Solo lo que no se puede volver a bajar: adjuntos y módulos propios. Los módulos Enterprise (2,3 GB) y la
# imagen de Docker NO van acá: no cambian y están en el export semanal de la VM completa.
DIRECTORIOS=(
  /root/odoo19-proyecto/odoo-data/.local/share/Odoo/filestore          # adjuntos de producción
  "?/root/odoo19-proyecto/odoo-data-test/.local/share/Odoo/filestore"  # adjuntos de la base de prueba ("?" = opcional)
  /root/odoo19-proyecto/addons/custom                                  # módulos propios (hay algunos sin subir a git)
)

CONFIGS=(
  /root/odoo19-proyecto/docker-compose.yml
  /root/odoo19-proyecto/config
  "?/root/odoo19-proyecto/config-test"
  "?/root/odoo19-proyecto/docker"
  "?/root/odoo19-proyecto/.env"
)

RETENER=8
