# /etc/hepta-backup.conf de la VM v-HGSVRLNX004 (correo: mailcow). Permisos 600, dueño root.
# No lleva contraseñas: los volcados corren dentro de los contenedores, que ya tienen las suyas.
NOMBRE=v-HGSVRLNX004
PG_MODO=ninguno

# Base de mailcow (dominios, buzones, alias, contraseñas): volcado lógico de MariaDB
read -r -d '' MAILCOW_SQL <<'CMD' || true
docker exec mailcowdockerized-mysql-mailcow-1 sh -c 'D=$(command -v mariadb-dump || command -v mysqldump); exec "$D" --default-character-set=utf8mb4 --single-transaction --routines -u root -p"$MYSQL_ROOT_PASSWORD" --all-databases' | gzip
CMD
# Redis guarda las claves DKIM: se le pide que grabe y se copia el archivo
read -r -d '' MAILCOW_REDIS <<'CMD' || true
docker exec mailcowdockerized-redis-mailcow-1 sh -c 'if [ -n "$REDISPASS" ]; then redis-cli -a "$REDISPASS" --no-auth-warning save >/dev/null; else redis-cli save >/dev/null; fi; cat /data/dump.rdb'
CMD
VOLCADOS_EXTRA=(
  "mailcow.sql.gz|$MAILCOW_SQL"
  "redis-dkim.rdb|$MAILCOW_REDIS"
)

DIRECTORIOS=(
  /var/lib/docker/volumes/mailcowdockerized_vmail-vol-1/_data     # los buzones
  /var/lib/docker/volumes/mailcowdockerized_crypt-vol-1/_data     # claves con las que están cifrados los buzones: sin esto no se leen
  /var/lib/docker/volumes/mailcowdockerized_rspamd-vol-1/_data    # aprendizaje del antispam
)
# No van: antivirus (se baja solo), índices de búsqueda (se regeneran), cola de salida.

CONFIGS=(
  /opt/mailcow-dockerized/mailcow.conf
  /opt/mailcow-dockerized/data/conf
  /opt/mailcow-dockerized/data/assets/ssl
  "?/opt/mailcow-dockerized/docker-compose.override.yml"
)

RETENER=8
