# /etc/hepta-backup.conf de la VM HGSVRLNX104 (Odoo 19 CE multi-tenant). Permisos 600, dueño root.
NOMBRE=HGSVRLNX104

# Postgres en la VM: una base por tenant. Se respaldan todas, también las de prueba (son chicas y
# así no hay que tocar este archivo cada vez que nace un cliente).
PG_MODO=host
PG_BASES=auto
PG_EXCLUIR=""

DIRECTORIOS=(
  /opt/odoo/instances/19.0/data/filestore   # adjuntos de todos los tenants
  /opt/odoo/instances/19.0/addons           # incluye planes retirados que ya no están en el repositorio
  /opt/odoo/scripts                         # script de alta en uso
)

CONFIGS=(
  /etc/odoo19.conf
  /etc/odoo19-staging.conf
  /opt/hepta/provision_api
  /etc/sudoers.d/odoo-provision
)

RETENER=8
