# /etc/hepta-backup.conf de la VM dkr-hgsvrlnx003 (nginx perimetral y API perimetral). Permisos 600, dueño root.
# No tiene bases de datos: lo que importa es la configuración de los sitios y los certificados.
NOMBRE=dkr-hgsvrlnx003
PG_MODO=ninguno

DIRECTORIOS=(
  /opt/hepta        # API perimetral
  /opt/hgo-webui
  /var/www
)

CONFIGS=(
  /etc/nginx
  /etc/letsencrypt
  /etc/cron.d/certbot
  "?/etc/systemd/system/hepta-perimetral.service"
)

RETENER=8
