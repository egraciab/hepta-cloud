services:
  db:
    image: postgres:16
    restart: unless-stopped
    extra_hosts:
      - "mail.hepta.com.py:192.168.10.213"
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${DATA_ROOT}/db:/var/lib/postgresql/data
    networks: [interna]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    extra_hosts:
      - "mail.hepta.com.py:192.168.10.213"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks: [interna]
  app:
    image: nextcloud:${NC_TAG}
    restart: unless-stopped
    extra_hosts:
      - "mail.hepta.com.py:192.168.10.213"
    depends_on: [db, redis]
    ports:
      - "10.10.50.220:${APP_PORT}:80"
    environment: &ncenv
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_HOST_PASSWORD: ${REDIS_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${FQDN}
      OVERWRITEPROTOCOL: https
      OVERWRITEHOST: ${FQDN}
      OVERWRITECLIURL: https://${FQDN}
      TRUSTED_PROXIES: 192.168.10.125
      PHP_MEMORY_LIMIT: 1G
      PHP_UPLOAD_LIMIT: 10G
    volumes: &ncvol
      - ${DATA_ROOT}/html:/var/www/html
      - ${DATA_ROOT}/data:/var/www/html/data
    networks: [interna, shared]
  cron:
    image: nextcloud:${NC_TAG}
    restart: unless-stopped
    extra_hosts:
      - "mail.hepta.com.py:192.168.10.213"
    depends_on: [db, redis]
    entrypoint: /cron.sh
    environment: *ncenv
    volumes: *ncvol
    # Las tareas de fondo también hablan con OnlyOffice y con el antivirus: sin la red compartida, la
    # verificación diaria de OnlyOffice falla y deja el editor deshabilitado (pasó el 20-nov).
    networks: [interna, shared]
networks:
  interna: {}
  shared:
    external: true
    name: hd-shared
