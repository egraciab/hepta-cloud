# clamd.conf de HEPTA Drive (ClamAV compartido, imagen clamav/clamav:stable 1.5.x).
# Se monta en solo lectura sobre /etc/clamav/clamd.conf (ver compose.yaml). Lo que no figura acá queda con el
# valor de fábrica de la imagen; en 1.5: MaxFileSize 400M y MaxScanSize 1000M, que no se bajan.
#
# Ajustado el 2026-11-27, después de los rechazos "No connection to anti virus" en la primera sincronización
# masiva (dos notebooks a la vez con 4 vCPU). Con 8 vCPU y esto, la carga quedó en ~3.

LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

# Nextcloud manda cada archivo en bloques de 25 MB (26214400 bytes): con el StreamMaxLength de fábrica (25M) el
# bloque quedaba justo en el límite. 100M da margen.
StreamMaxLength 100M
# Archivos analizados a la vez (cada uno usa un núcleo): 12 con 8 vCPU, el resto espera en la cola.
MaxThreads 12
MaxQueue 200
# Segundos que clamd espera datos de un cliente antes de cortar.
ReadTimeout 300
